<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>
  <!-- White cells -->
  <rect x="3" y="3" width="8" height="8" rx="1" fill="white"/>
  <rect x="13" y="3" width="8" height="8" rx="1" fill="white"/>
  <rect x="23" y="3" width="6" height="8" rx="1" fill="white"/>
  <rect x="3" y="13" width="8" height="8" rx="1" fill="white"/>
  <rect x="13" y="13" width="8" height="8" rx="1" fill="#fbbf24"/>
  <rect x="23" y="13" width="6" height="8" rx="1" fill="white"/>
  <rect x="3" y="23" width="8" height="6" rx="1" fill="white"/>
  <rect x="13" y="23" width="8" height="6" rx="1" fill="white"/>
  <!-- Black cells -->
  <rect x="23" y="23" width="6" height="6" rx="1" fill="#1a1a1a"/>
  <!-- Letter hints -->
  <text x="6" y="10" text-anchor="middle" font-size="6" font-weight="900" font-family="Arial,sans-serif" fill="#1a1a1a">C</text>
  <text x="16" y="10" text-anchor="middle" font-size="6" font-weight="900" font-family="Arial,sans-serif" fill="#1a1a1a">W</text>
  <text x="6" y="20" text-anchor="middle" font-size="6" font-weight="900" font-family="Arial,sans-serif" fill="#1a1a1a">D</text>
  <text x="16" y="20" text-anchor="middle" font-size="6" font-weight="900" font-family="Arial,sans-serif" fill="#1a1a1a">X</text>
</svg>
